name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build Linux release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="dist/stage-${arch}"
            mkdir -p "$stage"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${stage}/agys" ./cmd/agys
            tar -C "$stage" -czf "dist/agys_linux_${arch}.tar.gz" agys
            rm -rf "$stage"
          done
          tar -C plugin -czf "dist/nox.agys-plugin.tar.gz" nox.agys
          (cd dist && sha256sum agys_linux_amd64.tar.gz agys_linux_arm64.tar.gz nox.agys-plugin.tar.gz > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agys_linux_amd64.tar.gz
            dist/agys_linux_arm64.tar.gz
            dist/nox.agys-plugin.tar.gz
            dist/checksums.txt
